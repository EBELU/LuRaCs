[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LuRaCs"
version = "0.0.0"
description = "Gamma Spectroscopy Software"
requires-python = ">=3.10,<3.14"
authors = [
    {name = "Erik Ewald"}
]
license = {text = "GPL-3.0"}
readme = "README.md"
dependencies = [
    "bleak>=0.21",
    "numpy>=1.26",
    "pyqtgraph>=0.13.0",
    "PySide6>=6.5.0",
    "qasync>=0.27.0",
    "openpyxl>=3.0.0",
    "pyusb>=1.0.2",
    "lxml>=4.6.0",
    "libusb_package",
    "uncertainties",
    "plotext",
    "prompt_toolkit",
    "markdown",
    "Scikit-Learn",
    "SciPy",

    "RaysidClient @ git+https://github.com/EBELU/RaysidClient.git",
]

[project.optional-dependencies]
dev = [
    "pandas",
    "pyinstaller",
    "odfpy",
]


[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.setuptools.package-data]
luracs = ["resources/**/*"]

[project.scripts]
LuRaCs = "luracs.main:main"
