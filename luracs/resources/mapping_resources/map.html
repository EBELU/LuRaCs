<!DOCTYPE html>
<html lang="en">

<head>
    <title>Data map</title>
    <meta property="og:description" content="A map of collected data" />
    <meta property="og:created" content="2025-06-25" />
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Load MapLibre from the same directory as this HTML file -->
    <link rel="stylesheet" href="maplibre-gl.css">
    <script src="maplibre-gl.js"></script>

    <!-- Qt WebChannel -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>

    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script>
        const data_points = {};

        function add_data_point(id, lat, lon, colour, popup_text) {
            const el = document.createElement("div");
            el.id = id;

            el.style.width = "13px";
            el.style.height = "13px";
            el.style.borderRadius = "50%";
            el.style.backgroundColor = colour;
            el.style.border = "3px solid white";
            el.style.boxSizing = "border-box";

            const popup = new maplibregl.Popup({ offset: 9 }).setText(
                popup_text
            );

            const marker = new maplibregl.Marker({ element: el })
                .setLngLat([lon, lat])
                .setPopup(popup)
                .addTo(map);

            data_points[id] = { marker, el };
        }

        function change_data_point_colour(id, colour) {
            const obj = data_points[id];
            if (!obj) return;
            obj.el.style.backgroundColor = colour;
        }

        function remove_data_point(id) {
            const obj = data_points[id];
            if (!obj) return;
            obj.marker.remove();
            delete data_points[id];
        }

        function remove_all_data_points() {
            for (const id in data_points) {
                data_points[id].marker.remove();
            }

            // Clear the object
            for (const id in data_points) {
                delete data_points[id];
            }
        }

        function createJsMap(style) {
            if (map) {
                map.remove();
            }

            map = new maplibregl.Map({
                container: "map",
                style: style,
                center: [13.197, 55.7122],
                zoom: 11
            });

            map.on("load", () => {
                console.log("Map loaded");
            });

            map.on("mousemove", (e) => {
                if (bridge) {
                    bridge.mouse_move(
                        JSON.stringify(e.point),
                        JSON.stringify(e.lngLat.wrap())
                    );
                }
            });

            map.addControl(new maplibregl.NavigationControl(), 'top-right');
        }

        let bridge = null;
        let bridgeReady = false;
        map = null;

        new QWebChannel(qt.webChannelTransport, function (channel) {
            bridge = channel.objects.bridge;
            bridgeReady = true;

            bridge.from_js("Web channel ready");
        });

    </script>
</body>

</html>
