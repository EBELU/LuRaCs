<!DOCTYPE html>
<html lang="en">

<head>
    <title>Data map</title>
    <meta property="og:description" content="A map of collected data" />
    <meta property="og:created" content="2025-06-25" />
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Load MapLibre from the same directory as this HTML file -->
    <link rel="stylesheet" href="maplibre-gl.css">
    <script src="maplibre-gl.js"></script>

    <!-- Qt WebChannel -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>

    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        .maplibregl-ctrl-scale {
            background: transparent !important;
            color: #222;
            border-color: #222;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script>
        const data_points = {
            type: "FeatureCollection",
            features: []
        };

        let data_points_source = null;
        let active_popup = null;

        function add_data_point(id, lat, lon, colour, popup_text) {
            data_points.features.push({
                type: "Feature",
                id: id,
                geometry: {
                    type: "Point",
                    coordinates: [lon, lat]
                },
                properties: {
                    id: id,
                    colour: colour,
                    popup_text: popup_text
                }
            });
            
            if (!data_points_source) {
                return;
            }
            data_points_source.setData(data_points);
        }


        function set_data_points(points) {
            /*
            * points is an array like:
            *
            * [
            *     {
            *         id: 0,
            *         lat: 55.1,
            *         lon: 13.1,
            *         colour: "rgba(...)",
            *         popup_text: "Value 1.23"
            *     },
            *     ...
            * ]
            */

            data_points.features = points.map(point => ({
                type: "Feature",
                id: point.id,
                geometry: {
                    type: "Point",
                    coordinates: [point.lon, point.lat]
                },
                properties: {
                    id: point.id,
                    colour: point.colour,
                    popup_text: point.popup_text
                }
            }));

            if (!data_points_source) {
                return;
            }
            data_points_source.setData(data_points);
        }


        function set_data_point_colours(colours) {
            if (colours.length !== data_points.features.length) {
                console.error(
                    `Colour count (${colours.length}) does not match ` +
                    `point count (${data_points.features.length})`
                );
                return;
            }

            for (let i = 0; i < data_points.features.length; i++) {
                data_points.features[i].properties.colour = colours[i];
            }
            if (!data_points_source) {
                return;
            }
            data_points_source.setData(data_points);
        }

        function remove_all_data_points() {
            data_points.features = [];

            if (data_points_source) {
                data_points_source.setData(data_points);
            }

            if (active_popup) {
                active_popup.remove();
                active_popup = null;
            }
        }

        function createJsMap(style) {
            if (map) {
                map.remove();
            }

            map = new maplibregl.Map({
                container: "map",
                style: style,
                center: [13.197, 55.7122],
                zoom: 11
            });

            map.on("load", () => {
                console.log("Map loaded");

                map.addSource("data_points", {
                    type: "geojson",
                    data: data_points
                });

                map.addLayer({
                    id: "data_points",
                    type: "circle",
                    source: "data_points",
                    paint: {
                        "circle-radius": 6,
                        "circle-color": ["get", "colour"],
                        "circle-stroke-width": 0,
                        "circle-stroke-color": "#ffffff"
                    }
                });
                
                data_points_source = map.getSource("data_points");

                // Important: render anything that arrived before map load.
                
                if (data_points_source) {
                    data_points_source.setData(data_points);
                }

                data_points_source = map.getSource("data_points");

                map.on("click", "data_points", (e) => {
                    if (!e.features || e.features.length === 0) {
                        return;
                    }

                    const feature = e.features[0];

                    if (active_popup) {
                        active_popup.remove();
                    }

                    active_popup = new maplibregl.Popup({
                        offset: 9
                    })
                        .setLngLat(feature.geometry.coordinates)
                        .setText(feature.properties.popup_text)
                        .addTo(map);
                });

                map.on("click", (e) => {
                    const features = map.queryRenderedFeatures(e.point, {
                        layers: ["data_points"]
                    });

                    if (features.length === 0 && active_popup) {
                        active_popup.remove();
                        active_popup = null;
                    }
                });



                map.on("mouseenter", "data_points", () => {
                    map.getCanvas().style.cursor = "pointer";
                });

                map.on("mouseleave", "data_points", () => {
                    map.getCanvas().style.cursor = "";
                });
            });

            map.on("mousemove", (e) => {
                if (bridge) {
                    bridge.mouse_move(
                        JSON.stringify(e.point),
                        JSON.stringify(e.lngLat.wrap())
                    );
                }
            });

            map.addControl(
                new maplibregl.ScaleControl({
                    maxWidth: 150,
                    unit: "metric"
                }),
                "bottom-left"
            );

            map.addControl(
                new maplibregl.NavigationControl(),
                "top-right"
            );
        }


        let bridge = null;
        let bridgeReady = false;
        map = null;

        new QWebChannel(qt.webChannelTransport, function (channel) {
            bridge = channel.objects.bridge;
            bridgeReady = true;

            bridge.from_js("Web channel ready");
        });

        let current_location_marker = null;

        function add_current_location_point(lat, lng) {
            // Remove an existing marker first
            if (current_location_marker) {
                current_location_marker.remove();
            }

            const el = document.createElement("div");

            el.style.width = "16px";
            el.style.height = "16px";
            el.style.borderRadius = "50%";
            el.style.backgroundColor = "#2196F3";
            el.style.border = "3px solid white";
            el.style.boxShadow = "0 0 0 2px #2196F3";
            el.style.boxSizing = "border-box";
            el.style.zIndex = "9999";

            current_location_marker = new maplibregl.Marker({
                element: el
            })
                .setLngLat([lng, lat])
                .addTo(map);
        }


        function move_current_location_point(lat, lng) {
            if (!current_location_marker) {
                // If it doesn't exist yet, create it
                add_current_location_point(lat, lng);
                return;
            }

            current_location_marker.setLngLat([lng, lat]);
        }


        function remove_current_location_point() {
            if (!current_location_marker) {
                return;
            }

            current_location_marker.remove();
            current_location_marker = null;
        }

        function move_view_to(lat, lng, zoom = null) {
            const options = {
                center: [lng, lat],
                essential: true
            };

            if (zoom !== null) {
                options.zoom = zoom;
            }

            map.flyTo(options);
        }



    </script>
</body>

</html>
